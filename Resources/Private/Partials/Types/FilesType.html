{namespace sav=YolfTypo3\SavLibraryKickstarter\ViewHelpers}
<f:form.select id="conf_files_type"
	name="{section}[fields][{selectedFieldKey}][conf_files_type]"
	options="{
  imagefile:'{f:translate(key:\'kickstarter.field.conf_files_type.imagefile\')}',
  mediafile:'{f:translate(key:\'kickstarter.field.conf_files_type.mediafile\')}',
  textfile:'{f:translate(key:\'kickstarter.field.conf_files_type.textfile\')}'}"
	value="{field.conf_files_type}" />
<label for="conf_files_type"><f:translate
		key="kickstarter.field.conf_files_type" /></label>

<f:if condition="{isMvc}">		
<f:form.textfield id="conf_files_uploadFolder" 
	name="{section}[fields][{selectedFieldKey}][conf_files_uploadFolder]"
	value="{f:if(condition:'{field.conf_files_uploadFolder}', then:'{field.conf_files_uploadFolder}', else:'1:/user_upload')}" 
	/>
<label for="conf_files"><f:translate
		key="kickstarter.field.conf_files_uploadFolder" /></label>		
</f:if>		
		
<f:form.textfield id="conf_files" class="integer"
	name="{section}[fields][{selectedFieldKey}][conf_files]"
	value="{field.conf_files}" />
<label for="conf_files"><f:translate
		key="kickstarter.field.conf_files" /></label>
<f:form.textfield id="conf_max_filesize" class="integer"
	name="{section}[fields][{selectedFieldKey}][conf_max_filesize]"
	value="{field.conf_max_filesize}" />
<label for="conf_max_filesize"><f:translate
		key="kickstarter.field.conf_max_filesize" /></label>
<f:form.textfield id="conf_files_selsize" class="integer"
	name="{section}[fields][{selectedFieldKey}][conf_files_selsize]"
	value="{field.conf_files_selsize}" />
<label for="conf_files_selsize"><f:translate
		key="kickstarter.field.conf_files_selsize" /></label>
